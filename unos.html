<div class="form-page">

    <form enctype="multipart/form-data" action="skripta.php" method="POST" name="unosVijesti">

        <div class="form-item">
            <label for="title">Naslov vijesti</label>
            <div class="form-field">
                <input type="text" name="title" id="title" class="form-field-textual" autocomplete="off">
            </div>
            <span id="porukaTitle" class="bojaPoruke"></span>
        </div>

        <div class="form-item">
            <label for="about">Kratki sadržaj vijesti (do 200 znakova)</label>
            <div class="form-field">
                <textarea name="about" id="about" cols="30" rows="4" maxlength="200" class="form-field-textual"></textarea>
            </div>
            <span id="porukaAbout" class="bojaPoruke"></span>
        </div>

        <div class="form-item">
            <label for="content">Sadržaj vijesti</label>
            <div class="form-field">
                <textarea name="content" id="content" cols="30" rows="8" class="form-field-textual"></textarea>
            </div>
            <span id="porukaContent" class="bojaPoruke"></span>
        </div>

        <div class="form-item">
            <label for="pphoto">Slika</label>
            <div class="form-field">
                <input type="file" accept="image/jpeg,image/png,image/gif,image/webp" id="pphoto" name="pphoto">
            </div>
        </div>

        <div class="form-item">
            <label for="category">Kategorija vijesti</label>
            <div class="form-field">
                <select name="category" id="category" class="form-field-textual">
                    <option value="mundo">Mundo</option>
                    <option value="deporte">Deporte</option>
                </select>
            </div>
        </div>

        <div class="form-item">
            <label>
                Spremiti u arhivu:
                <div class="form-field" style="display:inline-block; margin-left:10px;">
                    <input type="checkbox" name="archive" id="archive">
                </div>
            </label>
        </div>

        <div class="form-item">
            <button type="reset"  class="btn btn-secondary">Poništi</button>
            <button type="submit" class="btn btn-primary" id="slanje">Prihvati</button>
        </div>

    </form>

<!-- JavaScript validacija -->
<script>
document.getElementById('slanje').addEventListener('click', function(event) {
    var ok = true;

    var title = document.getElementById('title').value.trim();
    var porukaTitle = document.getElementById('porukaTitle');
    if (title.length === 0) {
        ok = false;
        porukaTitle.textContent = 'Unesite naslov vijesti!';
        document.getElementById('title').style.border = '1.5px dashed #e8311a';
    } else {
        porukaTitle.textContent = '';
        document.getElementById('title').style.border = '1.5px solid #22c55e';
    }

    var about = document.getElementById('about').value.trim();
    var porukaAbout = document.getElementById('porukaAbout');
    if (about.length === 0) {
        ok = false;
        porukaAbout.textContent = 'Unesite kratki sadržaj!';
        document.getElementById('about').style.border = '1.5px dashed #e8311a';
    } else {
        porukaAbout.textContent = '';
        document.getElementById('about').style.border = '1.5px solid #22c55e';
    }

    var content = document.getElementById('content').value.trim();
    var porukaContent = document.getElementById('porukaContent');
    if (content.length === 0) {
        ok = false;
        porukaContent.textContent = 'Unesite sadržaj vijesti!';
        document.getElementById('content').style.border = '1.5px dashed #e8311a';
    } else {
        porukaContent.textContent = '';
        document.getElementById('content').style.border = '1.5px solid #22c55e';
    }

    if (!ok) event.preventDefault();
});
</script>
